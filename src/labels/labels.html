
<template>
    <require from="./table_data_layer"></require>

    <!-- list item for each labels_info.zarrSources -->
    <div show.bind="labels_info.ready">
        <div repeat.for="zarrSource of labels_info.zarrSources" style="border-bottom: solid 1px #bbb; margin-bottom: 10px; padding-bottom: 5px;">
            <div class="flex-row" title="${zarrSource.source}">
                <input type="checkbox" checked.bind="zarrSource.visible">
                 ${zarrSource.source}
            </div>
            <!-- edit panel - show if visible -->
            <div show.bind="zarrSource.visible">
                <div class="flex-row">
                    <div>Add data:</div>
                    <select change.delegate="addTableToLabels(zarrSource.id, $event.target.value)">
                        <option value="">-- Select a table --</option>
                        <option repeat.for="table of labels_info.omeroTables" value="${table.file.id}">${table.file.name}</option>
                    </select>
                </div>

                <!-- Summary of the layers - first one has no OMERO.table, others are added from Table select above -->
                <!-- This list allows user to choose SELECTED layer -->
                <div class="flex-row layer-select" repeat.for="tableDataLayer of zarrSource.tableDataLayers" style="background-color: ${ tableDataLayer.id === zarrSource.selectedLayerId ? '#eee' : 'transparent'};">
                    <label style="flex: 0 0 auto;" title="Toggle visibility of this layer">
                        <input type="checkbox" style="display:none" checked.bind="tableDataLayer.visible" change.delegate="handleLayerVisibilityChange(tableDataLayer.id, $event.target.checked)"/>
                        ${tableDataLayer.visible ? '👁️' : '🚫'}
                    </label>
                    <label class="layer-select-label" title="${tableDataLayer.tableFilename}">
                        <div style="width: 25px; height: 20px; display: inline-block; margin-right: 5px; background-color: ${tableDataLayer.color}"></div>
                        <input style="display:none" type="checkbox" name="selectedLayer-${zarrSource.id}" checked.one-way="tableDataLayer.id === zarrSource.selectedLayerId" change.delegate="zarrSource.selectedLayerId = tableDataLayer.id"/>
                        <div>${tableDataLayer.name}</div>
                    </label>
                </div>

                <!-- SELECTED layer shown here -->
                <div repeat.for="tableDataLayer of zarrSource.tableDataLayers">
                    <table_data_layer show.one-way="tableDataLayer.id === zarrSource.selectedLayerId" table_data_layer.bind="tableDataLayer"></table_data_layer>
                </div>
            </div>
        </div>
    </div>

</template>
