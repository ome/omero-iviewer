
<template>

    <!-- list item for each labels_info.zarrSources -->
    <div show.bind="labels_info.ready">
        <div repeat.for="zarrSource of labels_info.zarrSources">
            <div class="zarrSourceHeader" title="${zarrSource.source}">
                <input type="checkbox" checked.bind="zarrSource.visible">
                 ${zarrSource.source}
            </div>
            <!-- edit panel - show if visible -->
            <div show.bind="zarrSource.visible">
                <div class="zarrSourceHeader">
                    <div>Opacity:</div>
                    <input type="range" min="0" max="1" step="0.01" style="width: 150px;"
                        value.bind="zarrSource.opacity">
                    <!-- <div>${zarrSource.opacity}</div> -->
                </div>
                <!-- channel color -->
                <div class="zarrSourceHeader">
                    <div>Fill Color:</div>
                    <!-- on change, call requestLabelRerender -->
                    <input type="color" value.bind="zarrSource.color" change.delegate="requestLabelRerender(zarrSource.id)">
                    <div style="margin-left: 30px">Auto:</div>
                    <input type="checkbox" checked.bind="zarrSource.autoColor" change.delegate="requestLabelRerender(zarrSource.id)">
                </div>
            </div>
        </div>
    </div>

</template>
