<template>
  <div>
    Name: ${table_data_layer.name}
    <span show.bind="row_count">
      (${row_count} rows)
    </span>
    </div>

    <div show.bind="table_data_layer.tableFileId" class="flex-row">
      Matching Objects: ${match_count !== undefined ? match_count : ''}
    </div>

    <div class="flex-row">
        <div>Opacity:</div>
        <input type="range" min="0" max="1" step="0.01" style="width: 150px;"
            change.delegate="requestLabelRerender(table_data_layer.id)"
            value.bind="table_data_layer.opacity">
        <!-- <div>${table_data_layer.opacity}</div> -->
    </div>
    <!-- channel color -->
    <div class="flex-row">
        <div>Fill Color:</div>
        <!-- on change, call requestLabelRerender -->
        <input type="color" value.bind="table_data_layer.color" change.delegate="requestLabelRerender(table_data_layer.id)">
        <div style="margin-left: 30px">Auto:</div>
        <input type="checkbox" checked.bind="table_data_layer.autoColor" change.delegate="requestLabelRerender(table_data_layer.id)">
    </div>


    <!-- only show if table_data_layer has tableFileId -->
    <form show.bind="table_data_layer.tableFileId" submit.trigger="onSubmit($event)">
      <div class="flex-row" repeat.for="clause of clauses" class="clause">
        <select
          name="column"
          model.bind="clause.column"
          style="flex: 1 1 120px; width: 120px"
        >
          <option
            repeat.for="column of numeric_columns"
            model.bind="column"
            value="${column.name}"
          >
            ${column.name}
          </option>
        </select>

        <select
          name="operator"
          model.bind="clause.operator"
          style="flex: 0 0 auto"
        >
          <option value="<">&lt;</option>
          <option value="<=">&lt;=</option>
          <option value="==">==</option>
          <option value=">=">&gt;=</option>
          <option value=">">&gt;</option>
          <option value="!=">!=</option>
        </select>

        <input
          type="text"
          name="value"
          model.bind="clause.value"
          style="flex: 1 1 120px; width: 100%"
        />
      </div>

      <div class="flex-row">
        <!-- button to add another clause -->
        <button type="button" click.delegate="addClause()" style="flex: 0 0 auto" title="Add a filter clause">+</button>
        <div style="flex: 1 1 auto"></div>
        <button type="submit" style="flex: 0 0 auto" title="Apply object filter">Apply</button>
      </div>
    </form>
  </div>
</template>
