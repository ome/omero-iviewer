<template>
    <require from="./sort"></require>
        <div if.bind="regions_info.image_info.roi_count > regions_info.roi_page_size"
            class="pagination-controls">
            Current Z/T plane has ${ regions_info.roi_count_on_current_plane } ROIs
        </div>
        <div if.bind="regions_info.roi_count_on_current_plane > regions_info.roi_page_size"
            class="pagination-controls">
            <div style="display: inline-block; width: 165px; white-space: nowrap;">
                Showing page:
                <input class="roi_page_number"
                    change.delegate="handlePageInput($event)"
                    value="${temp_sliding_page_number !== undefined ? temp_sliding_page_number + 1 :
                    regions_info.roi_page_number + 1}" />
                of ${pageCount}
            </div>
            <div class="glyphicon glyphicon-chevron-left"
                click.delegate="setPage(regions_info.roi_page_number - 1)">
            </div>
           <input disabled.bind="regions_info.is_pending" type="range"
             input.delegate="handlePageRangeSlide($event)"
             change.delegate="handlePageRange($event)"
            min="0" value="${regions_info.roi_page_number}" max="${pageCount - 1}"
            style="position: relative; top: 2px; width: 100px; display: inline-block"/>
            <div class="glyphicon glyphicon-chevron-right"
                click.delegate="setPage(regions_info.roi_page_number + 1)">
           </div>
        </div>
        
        <div class="disabled-color loading-text" show.bind="!regions_info.ready">Loading Regions...</div>

            <div class="columns-dropdown dropdown">
                <button type="button"
                    class="btn btn-default btn-sm dropdown-toggle
                            glyphicon glyphicon-option-vertical"
                    style="padding: 0px; top: -2px; right: 0; position: absolute;"
                    data-toggle="dropdown">
                </button>
                <ul class="dropdown-menu">
                    <li click.delegate="showColumn('comments')">
                        <span show.bind="visible_columns.indexOf('comments') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('comments') === -1">&nbsp;</span>
                        <a href="#">Show Comments</a>
                    </li>
                    <li click.delegate="showColumn('area')">
                        <span show.bind="visible_columns.indexOf('area') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('area') === -1">&nbsp;</span>
                        <a href="#">Show Area</a>
                    </li>
                    <li click.delegate="showColumn('length')">
                        <span show.bind="visible_columns.indexOf('length') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('length') === -1">&nbsp;</span>
                        <a href="#">Show Length</a>
                    </li>
                    <li click.delegate="showColumn('roi_tags')">
                        <span show.bind="visible_columns.indexOf('roi_tags') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('roi_tags') === -1">&nbsp;</span>
                        <a href="#">Show ROI Tags</a>
                    </li>
                    <li class="divider"></li>
                    <li click.delegate="showColumn('theZ')">
                        <span show.bind="visible_columns.indexOf('theZ') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('theZ') === -1">&nbsp;</span>
                        <a href="#">Show Z</a>
                    </li>
                    <li click.delegate="showColumn('theT')">
                        <span show.bind="visible_columns.indexOf('theT') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('theT') === -1">&nbsp;</span>
                        <a href="#">Show T</a>
                    </li>
                    <li click.delegate="showColumn('theC')">
                        <span show.bind="visible_columns.indexOf('theC') > -1">&#10003;</span>
                        <span show.bind="visible_columns.indexOf('theC') === -1">&nbsp;</span>
                        <a href="#">Show C</a>
                    </li>
                </ul>
            </div>

        <div class="regions-table-container" style="height: 100%; overflow: auto;">

        <table style="width: 100%">
        <thead class="regions-header">
            <th class="regions-table-col roi-toggle">
                <input id="shapes_visibility_toggler"
                        title="Show/Hide all rois"
                        checked.one-way="regions_info.visibility_toggles === 0"
                        show.bind="regions_info.number_of_shapes > 0"
                        change.delegate="toggleAllShapesVisibility($event)"
                        type="checkbox" />
            </th>
            <th class="regions-table-col shape-show">
                <label for="shapes_visibility_toggler"
                        show.bind="regions_info.number_of_shapes > 0">Show</label>
            </th>
            <th class="regions-table-col shape-type">&nbsp;</th>
            <th class="regions-table-col shape-z ${sortCss(sortBy, sortAscending, 'theZ')}"
                click.delegate="sort('theZ')"
                show.bind="visible_columns.indexOf('theZ') > -1">Z</th>
            <th class="regions-table-col shape-t ${sortCss(sortBy, sortAscending, 'theT')}"
                click.delegate="sort('theT')"
                show.bind="visible_columns.indexOf('theT') > -1">T</th>
            <th class="regions-table-col shape-c"
                show.bind="visible_columns.indexOf('theC') > -1">C</th>
            <th class="regions-table-col shape-comment ${sortCss(sortBy, sortAscending, 'shapeText')}"
                    click.delegate="sort('shapeText')"
                    show.bind="visible_columns.indexOf('comments') > -1">Comment
                </th>
            <th class="regions-table-col shape-area ${sortCss(sortBy, sortAscending, 'area')}"
                    click.delegate="sort('area')"
                    show.bind="visible_columns.indexOf('area') > -1">
                    Area (${regions_info.image_info.image_pixels_size.symbol_x ||
                            'px'}&#178;)
                </th>
            <th class="regions-table-col shape-length ${sortCss(sortBy, sortAscending, 'length')}"
                    click.delegate="sort('length')"
                    show.bind="visible_columns.indexOf('length') > -1">
                    Length (${regions_info.image_info.image_pixels_size.symbol_x ||
                            'px'})
                </th>
            <th class="regions-table-col shape-comment ${sortCss(sortBy, sortAscending, 'roitag')}"
                click.delegate="sort('roitag')"
                show.bind="visible_columns.indexOf('roi_tags') > -1">
                ROI Tags
            </th>
        </thead>

        <tbody class="regions-table" show.bind="regions_info.ready">
            <template repeat.for="[roi_id, roi] of regions_info.data | sort:sortBy:sortAscending:roi_tags">
                <template repeat.for="[shape_id, shape] of roi.shapes">
                    <tr if.bind="(roi.shapes.size - roi.deleted) > 1 &&
                                   roi.shapes.size > 1 && $first"
                        id="${'roi-' + roi_id}"
                        title="${(shape_id > 0 ? 'ROI: ' + roi_id + ', Shape: ' + shape_id : 'Unsaved') +
                                    (shape.owner ? '\nOwner: ' + shape.owner : '')}"
                        class="regions-table-row"
                        click.delegate="selectShape(roi_id, true, $event, true)">
                        <td class="regions-table-col roi-toggle">
                            <div title="Click to show/hide shapes"
                                 style="cursor: pointer"
                                 click.delegate="expandOrCollapseRoi(roi_id, $event)">
                                 ${roi.show ? '&#9660;' : '&#9658;'}
                             </div>
                         </td>
                         <td class="regions-table-col shape-show">
                             <input type="checkbox"
                                 title="Show/Hide shapes" checked.one-way="regions_info.roi_visibility_toggles[roi_id] === undefined || regions_info.roi_visibility_toggles[roi_id] === 0"
                                 change.delegate="toggleRoiVisibility(roi_id, $event)"/>
                         </td>
                         <td class="regions-table-col shape-type">
                             (${(roi.shapes.size - roi.deleted)})
                         </td>
                        <td class="regions-table-col shape-z" show.bind="visible_columns.indexOf('theZ') > -1"></td>
                        <td class="regions-table-col shape-t" show.bind="visible_columns.indexOf('theT') > -1"></td>
                        <td class="regions-table-col shape-c" show.bind="visible_columns.indexOf('theC') > -1"></td>
                        <td class="regions-table-col shape-comment" show.bind="visible_columns.indexOf('comments') > -1">
                            ${roi.name}
                        </td>
                        <td class="regions-table-col shape-area" show.bind="visible_columns.indexOf('area') > -1"></td>
                        <td class="regions-table-col shape-length" show.bind="visible_columns.indexOf('length') > -1"></td>
                        <td class="regions-table-col shape-length" show.bind="visible_columns.indexOf('roi_tags') > -1"></td>
                    </tr>
                    <tr if.bind="!(shape.deleted && shape.is_new) &&
                                   !(roi.shapes.size > 1 && !roi.show)"
                        title="${(shape_id > 0 ? 'ROI: ' + roi_id + ', Shape: ' + shape_id : 'Unsaved') +
                                    (shape.owner ? '\nOwner: ' + shape.owner : '') +
                                    (shape.type === 'mask' ? '\nMasks cannot be edited' : '')}"
                        id="${'roi-' + shape.shape_id}"
                        class="regions-table-row"
                        css="${shape.selected ? 'background-color: #d0d0ff;' : ''}
                             ${shape.deleted ? 'color: red;' :
                                (shape.modified ? 'color: blue;' : '')}"
                        click.delegate="selectShape(shape.shape_id, shape.selected, $event)">
                        <td class="regions-table-col roi-toggle"></td>
                        <td class="regions-table-col shape-show">
                            <input type="checkbox"
                                title="Show/Hide shape" checked.one-way="shape.visible"
                                change.delegate="toggleShapeVisibility(shape.shape_id, $event)"/>
                        </td>
                        <td class="regions-table-col shape-type ${shape.type.toLowerCase()}-icon
                            marker-${shape.MarkerStart.toLowerCase()}${shape.MarkerEnd.toLowerCase()}">
                        </td>
                        <td class="regions-table-col shape-z"
                            show.bind="visible_columns.indexOf('theZ') > -1">
                            ${shape.TheZ !== -1 ? (shape.TheZ + 1) : ""}
                        </td>
                        <td class="regions-table-col shape-t"
                            show.bind="visible_columns.indexOf('theT') > -1">
                            ${shape.TheT !== -1 ? (shape.TheT + 1) : ""}
                        </td>
                        <td class="regions-table-col shape-c"
                            show.bind="visible_columns.indexOf('theC') > -1">
                            ${shape.TheC !== -1 ? (shape.TheC + 1) : ""}
                        </td>
                        <td class="regions-table-col shape-comment"
                             show.bind="visible_columns.indexOf('comments') > -1">
                                ${shape.Text ? shape.Text : ''}
                        </td>
                        <td class="regions-table-col shape-area"
                             show.bind="visible_columns.indexOf('area') > -1"
                             title="${shape.Area && shape.Area > 0 ? shape.Area : ''}">
                                ${shape.Area && shape.Area > 0 ? shape.Area : ''}
                        </td>
                        <td class="regions-table-col shape-length"
                             show.bind="visible_columns.indexOf('length') > -1"
                             title="${shape.Length && shape.Length > 0 ? shape.Length : ''}">
                                ${shape.Length && shape.Length > 0 ? shape.Length : ''}
                        </td>
                        <td class="regions-table-col roi-tags"
                             show.bind="visible_columns.indexOf('roi_tags') > -1">
                            <span show.bind="roi_tags_loaded">
                                <span if.bind="roi_tags[roi_id]">
                                    <!-- Uses SortTagsValueConverter to sort tags -->
                                    <template repeat.for="t of roi_tags[roi_id] | sortTags:sortAscending">
                                        <div title="Added By ${t.link.owner.firstName} ${t.link.owner.lastName}, Tag: ${t.id}" class="tag">
                                            ${t.textValue}
                                            <button if.bind="t.link.permissions.canDelete" class="removeTag"
                                                    click.delegate="handleRemoveTag([t.link.id], [roi_id])">-</button>
                                        </div>
                                    </template>
                                </span>
                            </span>
                        </td>
                    </tr>
                </template>
            </template>
        </tbody>
        </table>
        </div>
</template>
